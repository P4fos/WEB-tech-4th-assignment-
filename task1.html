<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="train-page py-4 py-md-5">

  <main class="container">
    <div class="d-flex justify-content-center gap-2 mb-4">
      <a href="index.html" class="btn btn-outline-dark btn-sm">Home</a>
      <a href="task1.html" class="btn btn-dark btn-sm">Task 1</a>
      <a href="task2.html" class="btn btn-outline-dark btn-sm">Task 2</a>
      <a href="task3.html" class="btn btn-outline-dark btn-sm">Task 3</a>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card train-card">

          <div class="train-header p-4">
            <h1 class="h3 fw-bold mb-0">Book a train ticket</h1>
          </div>

          <div class="card-body p-4 p-md-5">
            <form>

              <div class="mb-4">
                <div class="btn-group trip-toggle">
                  <input type="radio" class="btn-check" name="tripType" id="oneWay" value="one-way" checked>
                  <label class="btn btn-outline-teal" for="oneWay">One way</label>

                  <input type="radio" class="btn-check" name="tripType" id="roundTrip" value="round-trip">
                  <label class="btn btn-outline-teal" for="roundTrip">Round trip</label>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="fromCity" name="fromCity" placeholder="" required>
                    <label for="fromCity">From</label>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="toCity" name="toCity" placeholder="" required>
                    <label for="toCity">To</label>
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-md-4">
                  <label for="departureDate" class="form-label">Departure</label>
                  <input type="date" class="form-control" id="departureDate" name="departureDate" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="returnDate" class="form-label">Return</label>
                  <input type="date" class="form-control" id="returnDate" name="returnDate">
                </div>
                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label">Passengers</label>
                  <select class="form-select" id="passengers" name="passengers">
                    <option value="1">1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>
              </div>

              <fieldset class="mb-3">
                <legend class="form-label mb-2">Carriage class</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriageClass" id="classSeat" value="seat" required>
                  <label class="form-check-label" for="classSeat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriageClass" id="classCoupe" value="coupe" checked required>
                  <label class="form-check-label" for="classCoupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriageClass" id="classSleeper" value="sleeper" required>
                  <label class="form-check-label" for="classSleeper">Sleeper</label>
                </div>
              </fieldset>

              <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">Phone</label>
                  <div class="input-group">
                    <span class="input-group-text phone-prefix">+7</span>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" required>
                </div>
              </div>

              <div class="mb-4">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" id="smsTicket" name="smsTicket">
                  <label class="form-check-label" for="smsTicket">Also send the ticket by SMS</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agreeRules" name="agreeRules" required>
                  <label class="form-check-label" for="agreeRules">I agree with the carriage rules</label>
                </div>
              </div>

              <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
                <button type="reset" class="btn btn-clear">Clear</button>
                <button type="submit" class="btn btn-find">Find trains</button>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </main>

</body>
</html>
