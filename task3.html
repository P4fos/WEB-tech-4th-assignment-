<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4 py-md-5">

  <main class="container">
    <div class="d-flex justify-content-center gap-2 mb-4">
      <a href="index.html" class="btn btn-outline-dark btn-sm">Home</a>
      <a href="task1.html" class="btn btn-outline-dark btn-sm">Task 1</a>
      <a href="task2.html" class="btn btn-outline-dark btn-sm">Task 2</a>
      <a href="task3.html" class="btn btn-dark btn-sm">Task 3</a>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold mb-4">Reserve a table</h1>
            <form>
              <div class="row g-3">

                <div class="col-12">
                  <label for="customerName" class="form-label">Your name</label>
                  <input type="text" class="form-control" id="customerName" name="customerName">
                </div>

                <div class="col-12 col-sm-6">
                  <label for="customerEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="customerEmail" name="customerEmail">
                </div>

                <div class="col-12 col-sm-6">
                  <label for="phone" class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" name="phone">
                </div>

                <div class="col-12 col-sm-6">
                  <label for="guests" class="form-label">Guests</label>
                  <input type="number" class="form-control" id="guests" name="guests">
                </div>

                <div class="col-12 col-sm-6">
                  <label for="reservationDate" class="form-label">Date</label>
                  <input type="date" class="form-control" id="reservationDate" name="reservationDate">
                </div>

                <div class="col-12">
                  <fieldset>
                    <legend class="form-label fs-6 mb-2">Seating</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="inside">
                      <label class="form-check-label" for="seatingInside">Inside</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="terrace">
                      <label class="form-check-label" for="seatingTerrace">Terrace</label>
                    </div>
                  </fieldset>
                </div>

                <div class="col-12">
                  <label for="mealTime" class="form-label">Meal time</label>
                  <select class="form-select" id="mealTime" name="mealTime">
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="comments" class="form-label">Comments</label>
                  <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" value="yes">
                    <label class="form-check-label" for="agreeTerms">I agree to the terms</label>
                  </div>
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary">Reserve</button>
                </div>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
